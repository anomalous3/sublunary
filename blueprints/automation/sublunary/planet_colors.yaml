# Generated by scripts/build_blueprints.py; edit there, not here.
blueprint:
  name: Sublunary planet colors
  description: >
    The bulb takes the color of the planet the Moon is reaching for. Brightness
    works as in the consensus light: bright when the contact perfects in her
    current sign, faint when only Lilly's orbs reach across the boundary. Hybrid
    uses what you'd see through a telescope where a planet has a color, tradition
    where it's only white or grey, and the bulb's warm white for the Sun. Golden
    Dawn uses the King scale for the seven classical planets.
  domain: automation
  input:
    contact_sensor:
      name: Dominant contact sensor
      selector:
        entity:
          filter:
            integration: sublunary
            domain: sensor
    lights:
      name: Lights
      description: Lights that should follow the sky.
      selector:
        entity:
          filter:
            domain: light
          multiple: true
    power:
      name: Power
      description: >
        Only adjusting lights that are on means a light someone turned off stays
        off. Turning it back on hands it to Sublunary again.
      default: only_when_on
      selector:
        select:
          options:
            - label: Only adjust lights that are on (never turns a light on)
              value: only_when_on
            - label: Full control (turns lights on and off)
              value: full_control
    void_style:
      name: When nothing is applying (void)
      default: dim
      selector:
        select:
          options:
            - label: Dim moonlight
              value: dim
            - label: Off (only with full control)
              value: "off"
    void_appearance:
      name: Void moonlight
      collapsed: true
      input:
        void_kelvin:
          name: White temperature
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        void_brightness:
          name: Brightness
          default: 3
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: "%"
    scheme:
      name: Color scheme
      default: hybrid
      selector:
        select:
          options:
            - label: Hybrid (telescope where it has color, tradition elsewhere; the Sun warm white)
              value: hybrid
            - label: Golden Dawn (outer planets from Hybrid)
              value: golden_dawn
            - label: Custom (the colors below)
              value: custom
    custom_colors:
      name: Custom colors
      description: Used when the scheme is Custom. Prefilled with Hybrid.
      collapsed: true
      input:
        sun_white:
          name: Sun as warm white
          description: Use the bulb's white LEDs for the Sun instead of the color above.
          default: true
          selector:
            boolean: {}
        sun_kelvin:
          name: Sun white temperature
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        sun_color:
          name: Sun
          default: [255, 176, 32]
          selector:
            color_rgb: {}
        mercury_color:
          name: Mercury (quicksilver)
          default: [190, 205, 255]
          selector:
            color_rgb: {}
        venus_color:
          name: Venus (green)
          default: [40, 220, 90]
          selector:
            color_rgb: {}
        mars_color:
          name: Mars (red)
          default: [255, 30, 10]
          selector:
            color_rgb: {}
        jupiter_color:
          name: Jupiter (violet)
          default: [150, 60, 255]
          selector:
            color_rgb: {}
        saturn_color:
          name: Saturn (deep indigo)
          default: [60, 40, 210]
          selector:
            color_rgb: {}
        uranus_color:
          name: Uranus (electric cyan)
          default: [0, 225, 255]
          selector:
            color_rgb: {}
        neptune_color:
          name: Neptune (sea blue)
          default: [20, 90, 255]
          selector:
            color_rgb: {}
        pluto_color:
          name: Pluto (magenta)
          default: [235, 20, 140]
          selector:
            color_rgb: {}
    transition:
      name: Transition (seconds)
      default: 120
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s

mode: restart

triggers:
  # no "to:" so attribute changes (depth, in_sign) also trigger
  - trigger: state
    entity_id: !input contact_sensor
  - trigger: homeassistant
    event: start
  # saving an automation in the UI reloads automations: apply immediately
  - trigger: event
    event_type: automation_reloaded
  # a light turned back on picks up the sky at once
  - trigger: state
    entity_id: !input lights
    from: "off"
    to: "on"

variables:
  lights: !input lights
  power: !input power
  base_transition: !input transition
  void_style: !input void_style
  void_kelvin: !input void_kelvin
  void_brightness: !input void_brightness
  sensor: !input contact_sensor
  body: "{{ states(sensor) }}"
  applying: "{{ body not in ['none', 'unknown', 'unavailable'] }}"
  # consensus brightness: bright in-sign, faint across the boundary
  bri: >-
    {% set d = state_attr(sensor, 'depth') | float(0) %}
    {% if state_attr(sensor, 'in_sign') %}{{ (60 + 40 * d) | round(0) | int }}
    {% else %}{{ (15 + 10 * d) | round(0) | int }}{% endif %}
  # under a simulated clock, fades shrink with it
  fade: "{{ (base_transition / (state_attr(sensor, 'clock_speed') | float(1))) | round(1) }}"
  scheme: !input scheme
  palettes:
    hybrid:
      sun: 2700
      mercury: [190, 205, 255]
      venus: [40, 220, 90]
      mars: [255, 30, 10]
      jupiter: [150, 60, 255]
      saturn: [60, 40, 210]
      uranus: [0, 225, 255]
      neptune: [20, 90, 255]
      pluto: [235, 20, 140]
    golden_dawn:
      sun: [255, 120, 0]
      mercury: [255, 225, 0]
      venus: [0, 200, 90]
      mars: [255, 20, 30]
      jupiter: [140, 40, 255]
      saturn: [70, 30, 180]
      uranus: [0, 225, 255]
      neptune: [20, 90, 255]
      pluto: [235, 20, 140]
  sun_white: !input sun_white
  sun_kelvin: !input sun_kelvin
  sun_rgb: !input sun_color
  mercury_rgb: !input mercury_color
  venus_rgb: !input venus_color
  mars_rgb: !input mars_color
  jupiter_rgb: !input jupiter_color
  saturn_rgb: !input saturn_color
  uranus_rgb: !input uranus_color
  neptune_rgb: !input neptune_color
  pluto_rgb: !input pluto_color
  custom:
    sun: "{{ sun_kelvin if sun_white else sun_rgb }}"
    mercury: "{{ mercury_rgb }}"
    venus: "{{ venus_rgb }}"
    mars: "{{ mars_rgb }}"
    jupiter: "{{ jupiter_rgb }}"
    saturn: "{{ saturn_rgb }}"
    uranus: "{{ uranus_rgb }}"
    neptune: "{{ neptune_rgb }}"
    pluto: "{{ pluto_rgb }}"
  palette: "{{ custom if scheme == 'custom' else palettes[scheme] }}"
  color: "{{ palette[body] if applying and body in palette else none }}"

actions:
  - repeat:
      for_each: "{{ lights }}"
      sequence:
        - if: "{{ power == 'full_control' or is_state(repeat.item, 'on') }}"
          then:
            - choose:
                - conditions: "{{ color is none and void_style == 'off' and power == 'full_control' }}"
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        transition: "{{ fade }}"
                - conditions: "{{ color is none }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ void_kelvin | int }}"
                        brightness_pct: "{{ void_brightness | int }}"
                        transition: "{{ fade }}"
                - conditions: "{{ color is number }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ color | int }}"
                        brightness_pct: "{{ bri }}"
                        transition: "{{ fade }}"
              default:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    rgb_color: "{{ color }}"
                    brightness_pct: "{{ bri }}"
                    transition: "{{ fade }}"
