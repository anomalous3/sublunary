# Generated by scripts/build_blueprints.py; edit there, not here.
blueprint:
  name: Sublunary sign colors
  description: >
    The bulb takes a color for the sign the Moon is in: by element, or the
    Golden Dawn spectrum walked around the zodiac.
  domain: automation
  input:
    sign_sensor:
      name: Moon sign sensor
      selector:
        entity:
          filter:
            integration: sublunary
            domain: sensor
    lights:
      name: Lights
      description: Lights that should follow the sky.
      selector:
        entity:
          filter:
            domain: light
          multiple: true
    power:
      name: Power
      description: >
        Only adjusting lights that are on means a light someone turned off stays
        off. Turning it back on hands it to Sublunary again.
      default: only_when_on
      selector:
        select:
          options:
            - label: Only adjust lights that are on (never turns a light on)
              value: only_when_on
            - label: Full control (turns lights on and off)
              value: full_control
    scheme:
      name: Color scheme
      default: elements
      selector:
        select:
          options:
            - label: Elements (fire, earth, air, water)
              value: elements
            - label: Golden Dawn zodiac spectrum
              value: golden_dawn
            - label: Custom (the colors below)
              value: custom
    brightness:
      name: Brightness
      default: 70
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    custom_colors:
      name: Custom colors
      description: Used when the scheme is Custom. Prefilled with Elements.
      collapsed: true
      input:
        aries_color:
          name: Aries
          default: [255, 60, 10]
          selector:
            color_rgb: {}
        taurus_color:
          name: Taurus
          default: [40, 200, 60]
          selector:
            color_rgb: {}
        gemini_color:
          name: Gemini
          default: [0, 200, 255]
          selector:
            color_rgb: {}
        cancer_color:
          name: Cancer
          default: [20, 60, 255]
          selector:
            color_rgb: {}
        leo_color:
          name: Leo
          default: [255, 60, 10]
          selector:
            color_rgb: {}
        virgo_color:
          name: Virgo
          default: [40, 200, 60]
          selector:
            color_rgb: {}
        libra_color:
          name: Libra
          default: [0, 200, 255]
          selector:
            color_rgb: {}
        scorpio_color:
          name: Scorpio
          default: [20, 60, 255]
          selector:
            color_rgb: {}
        sagittarius_color:
          name: Sagittarius
          default: [255, 60, 10]
          selector:
            color_rgb: {}
        capricorn_color:
          name: Capricorn
          default: [40, 200, 60]
          selector:
            color_rgb: {}
        aquarius_color:
          name: Aquarius
          default: [0, 200, 255]
          selector:
            color_rgb: {}
        pisces_color:
          name: Pisces
          default: [20, 60, 255]
          selector:
            color_rgb: {}
    transition:
      name: Transition (seconds)
      default: 120
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s

mode: restart

triggers:
  - trigger: state
    entity_id: !input sign_sensor
  - trigger: homeassistant
    event: start
  # saving an automation in the UI reloads automations: apply immediately
  - trigger: event
    event_type: automation_reloaded
  # a light turned back on picks up the sky at once
  - trigger: state
    entity_id: !input lights
    from: "off"
    to: "on"

variables:
  lights: !input lights
  power: !input power
  base_transition: !input transition
  void_style: dim
  void_kelvin: 4000
  void_brightness: 3
  sensor: !input sign_sensor
  scheme: !input scheme
  bri: !input brightness
  key: "{{ states(sensor) }}"
  palettes:
    elements:
      aries: [255, 60, 10]
      taurus: [40, 200, 60]
      gemini: [0, 200, 255]
      cancer: [20, 60, 255]
      leo: [255, 60, 10]
      virgo: [40, 200, 60]
      libra: [0, 200, 255]
      scorpio: [20, 60, 255]
      sagittarius: [255, 60, 10]
      capricorn: [40, 200, 60]
      aquarius: [0, 200, 255]
      pisces: [20, 60, 255]
    golden_dawn:
      aries: [255, 20, 20]
      taurus: [255, 70, 0]
      gemini: [255, 120, 0]
      cancer: [255, 170, 0]
      leo: [240, 230, 0]
      virgo: [170, 230, 0]
      libra: [0, 200, 80]
      scorpio: [0, 170, 170]
      sagittarius: [20, 90, 255]
      capricorn: [60, 30, 190]
      aquarius: [140, 40, 255]
      pisces: [220, 0, 90]
  custom:
    aries: !input aries_color
    taurus: !input taurus_color
    gemini: !input gemini_color
    cancer: !input cancer_color
    leo: !input leo_color
    virgo: !input virgo_color
    libra: !input libra_color
    scorpio: !input scorpio_color
    sagittarius: !input sagittarius_color
    capricorn: !input capricorn_color
    aquarius: !input aquarius_color
    pisces: !input pisces_color
  palette: "{{ custom if scheme == 'custom' else palettes[scheme] }}"
  color: "{{ palette[key] if key in palette else none }}"
  fade: "{{ (base_transition / (state_attr('sensor.sublunary_clock', 'speed') | float(1))) | round(1) }}"

actions:
  - repeat:
      for_each: "{{ lights }}"
      sequence:
        - if: "{{ power == 'full_control' or is_state(repeat.item, 'on') }}"
          then:
            - choose:
                - conditions: "{{ color is none and void_style == 'off' and power == 'full_control' }}"
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        transition: "{{ fade }}"
                - conditions: "{{ color is none }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ void_kelvin | int }}"
                        brightness_pct: "{{ void_brightness | int }}"
                        transition: "{{ fade }}"
                - conditions: "{{ color is number }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        color_temp_kelvin: "{{ color | int }}"
                        brightness_pct: "{{ bri }}"
                        transition: "{{ fade }}"
              default:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    rgb_color: "{{ color }}"
                    brightness_pct: "{{ bri }}"
                    transition: "{{ fade }}"
